[versions]
minecraft      = "1.20.1"
forge          = "47.4.13"
parchment      = "2023.09.03"
kotlinForForge = "4.12.0"
flywheel       = "1.0.4"
mixinExtras    = "0.4.1"

[libraries]
emi-neoForge            = { group = "dev.emi",                  name = "emi-neoforge",              version     = "1.1.22+1.21.1"  }
kotlinForForge-forge    = { group = "thedarkcolour",            name = "kotlinforforge",            version.ref = "kotlinForForge" }
kotlinForForge-runtime  = { group = "maven.modrinth",           name = "kotlin-for-forge",          version.ref = "kotlinForForge" }
create                  = { group = "com.simibubi.create",      name = "create-1.20.1",             version     = "6.0.6-168"      }
registrate              = { group = "com.tterrag.registrate",   name = "Registrate",                version     = "MC1.20-1.3.3"   }
ponder-forge            = { group = "net.createmod.ponder",     name = "Ponder-Forge-1.20.1",       version     = "1.0.91"         }
flywheel-forge          = { group = "dev.engine-room.flywheel", name = "flywheel-forge-1.20.1",     version.ref = "flywheel"       }
flywheel-forge-api      = { group = "dev.engine-room.flywheel", name = "flywheel-forge-api-1.20.1", version.ref = "flywheel"       }
mixinExtras-common      = { group = "io.github.llamalad7",      name = "mixinextras-common",        version.ref = "mixinExtras"    }
mixinExtras-forge       = { group = "io.github.llamalad7",      name = "mixinextras-forge",         version.ref = "mixinExtras"    }

[plugins]
kotlin-jvm               = { id = "org.jetbrains.kotlin.jvm",         version = "2.2.20" }
modDevGradle-legacyForge = { id = "net.neoforged.moddev.legacyforge", version = "2.0.134" }